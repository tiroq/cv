experiences:
  title: Professional Experience
  current:
    role: Software Development Engineer in Test
    time: May 2024 - Present
    company: Exactpro Systems LLC
    summary: >-
      Develops and operates performance, load, resiliency, and protocol-testing
      tooling for exchange and post-trade platforms.
    projects:
      - title: Exchange Load Injection Platform
        summary: >-
          Developed and supported a Go load-injection tool for an exchange
          platform, with distributed-system monitoring and performance tuning.
        highlights:
          - Sustained throughput up to 300K messages/sec.
          - Analyzed 500 GB of raw production trading PCAP data to build realistic load profiles.
          - Reduced message preparation latency from 146 us to 6 us through parallelization and optimization.
        technologies: Go, PCAP, distributed monitoring, performance engineering

      - title: Historical Trading Data Replay
        summary: >-
          Built tooling to replay real historical trading data and validate new
          releases against production-like market activity.
        highlights:
          - Replays a full trading day in 30 minutes to 2 hours, depending on volume.
          - Supports all instruments or targeted instrument subsets for focused validation.
        technologies: Go, trading data, release validation, load testing

      - title: Kubernetes Multi-Matching-Engine Test Automation
        summary: >-
          Automated configuration, reference-data generation, load generation,
          performance-metric calculation, and order execution/market-data reports.
        highlights:
          - Supports realistic deployments with up to four matching engines.
          - Reduced manually maintained test variants from 30 to 10.
        technologies: Kubernetes, Python, Go, performance analytics, test data generation

      - title: Post-Trade Platform Testing
        summary: >-
          Automates performance and resiliency validation for post-trade and
          clearing workflows across configurable load pipelines.
        highlights:
          - Measures p50, p99, average, and maximum latency using k6 and FIX test flows.
          - Runs fully automated long-duration tests for up to 12 hours.
          - Validates AWS infrastructure spanning EKS, Lambda, databases, and EC2.
        technologies: k6, FIX, AWS, EKS, Lambda, EC2, resiliency testing


  - role: Quality Assurance Team Lead
    time: August 2020 - September 2021
    company: <a href="https://www.bpcbt.com/">BPC Banking Technologies</a>
    details: |
      What I did:
        - Designed and rolled out QA processes and standards to improve product quality and release stability
        - Tracked and reported defects in Jira/Confluence with full context for developers
        - Kept QA documentation (test plans, checklists, env setup) up to date
        - Planned and coordinated test activities and workload for the QA team

      Impact:
        - Analyzed Jira workload and cycle time → identified bottlenecks in review/testing and improved team throughput by ~15-20%
        - Automated testing in Kubernetes via GitLab CI/Jenkins → every feature branch was tested in an isolated test environment, reducing “works on my machine” issues
        - Added build sanity checks before QA started → cut wasted QA effort on broken branches by 30-40%
        - Enforced branch-level auto-tests before merge → defects caught earlier, regression escapes to QA/stage reduced by ~25%
        - Standardized manual test environments → fewer environment-related defects, manual test repeatability improved to ~90%
        - Automated backup/restore of QA env configs → recovery/setup time went from hours to minutes
        - Introduced task prioritization rules → team focused on high-value items first, lead time for priority defects dropped

      Tech Stack: Jira, Confluence, Gitlab CI/Jenkins, Python, Shell/Bash, Golang, PLSQL

  - role: Quality Assurance Team Lead - Trading & Low-Latency
    time: May 2018 - August 2020
    company: <a href="exactpro.com">Exactpro</a>
    details: |
      What I did:
        - Automated testing for non-standard financial/trading flows (FIX, ITCH, native exchange)
        - Built custom testing & analysis tools
        - Reviewed specs/requirements and turned them into test cases
        - Mentored junior testers
        - Optimized testing processes and met tight release cycles

      Impact:
        - Manual support of test environments reduced by 2-4x via automation (provisioning, reset, checks)
        - Delivered PoC for big-data / time-series analysis to speed up incident and performance analysis
        - Added InfluxDB + Grafana dashboards for test/run visibility

      Tech Stack:
        - Python, Shell/Bash, Golang, InfluxDB, Grafana, Ansible, Jmeter

  - role: Senior Quality Assurance Specialist
    time: October 2016 - May 2018
    company: <a href="exactpro.com">Exactpro</a>
    details: |
      What I did:
        - Tested financial/trading applications (non-functional + regression)
        - Automated non-standard trading flows (FIX, ITCH, native exchange)
        - Performed load/performance testing and built test tools
        - Analyzed specs and mentored junior QA specialists

      Impact:
        - Automated non-functional testing for 4 projects → consistent performance validation across trading systems
        - Built automated monitoring for testing environments → reduced manual checks and faster issue detection
        - Established data visualization with InfluxDB + Grafana → real-time test metrics and performance insights

      Tech Stack: Python, Shell/Bash, Golang, InfluxDB, Grafana, Ansible, JMeter, FIX/ITCH protocols, MySQL, MSSQL, PLSQL, Jira, Confluence, Redmine

  - role: Quality Assurance Specialist
    time: February 2014 - October 2016
    company: <a href="exactpro.com">Exactpro</a>
    details: |
      What I did:
        - Designed functional/regression tests for low-latency trading systems
        - Performed load testing for high-frequency apps
        - Built automated testing/analysis tools
        - Analyzed specs and reported issues

      Impact:
        - Created proof-of-concept for non-functional testing automation framework → foundation for future automation initiatives

      Tech Stack: Python, Shell/Bash, MySQL, MSSQL, PLSQL, FIX protocol, ITCH protocol, native exchange protocols, Jira, Confluence, Redmine

  - role: System Administrator Weblogic and Oracle Service Bus
    time: March 2013 - February 2014
    company: Home Credit & Finance Bank
    details: |
      What I did:
        - Provided 24x7 support for central integrated banking system (Oracle Service Bus)
        - Monitored system performance and analyzed metrics
        - Resolved real-time production issues and incidents
        - Supported and maintained test environments
        - Created automation scripts for system administration tasks

      Impact:
        - Automated test environment configuration and deployment → reduced setup time and human errors
        - Maintained 99.9% uptime for critical banking infrastructure → ensured business continuity
        - Resolved production incidents with average response time under 15 minutes → minimized business impact

      Tech Stack: RHEL, WebLogic, Oracle Service Bus, Python, Jython, Shell, Apache HTTP Server, Jira, Remedy, CA Wily monitoring

  - role: Network Engineer / System Administrator
    time: December 2010 - March 2013
    company: All-Russia Research Institute of Hydrometeorological Information, World Data Centre (RIHMI-WDC). Russia, Obninsk.
    details: |
      What I did:
        - Created, migrated and supported VMs in VMware ESXi infrastructure
        - Managed, configured and supported enterprise network equipment
        - Maintained remote servers and UNIX systems (FreeBSD)
        - Deployed and maintained web services, databases, and network services
        - Created automation scripts for system administration tasks

      Impact:
        - Integrated comprehensive IT infrastructure monitoring system (Zabbix) → proactive issue detection and faster resolution
        - Successfully deployed METEORF central communication infrastructure → improved meteorological data exchange
        - Managed multi-vendor network infrastructure → ensured reliable connectivity across research facilities

      Tech Stack: VMware ESXi, FreeBSD, MySQL, PostgreSQL, Apache, nginx, Python, Perl, PHP, Zabbix, D-Link, Cisco, Mikrotik, Ubiquiti network equipment

