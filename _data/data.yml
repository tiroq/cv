    and QA automation, including 12+ years in test engineering. Builds
    high-throughput test platforms, performance and resiliency pipelines, and
    developer tooling in Python and Go for trading, banking, embedded, and
    distributed systems. Combines hands-on engineering with 4+ years of QA
    leadership, including teams of 5-10 engineers.
  highlights:
    - 300K messages/sec load generation
    - Message preparation optimized from 146 us to 6 us
    - 500 GB production trading-data analysis

