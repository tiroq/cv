experiences:
  title: Professional Experience
  current:
    role: Software Development Engineer in Test
    time: May 2024 - Present
    company: Exactpro Systems LLC
    summary: >-
      Develops and operates performance, load, resiliency, and protocol-testing
      tooling for exchange and post-trade platforms.
    projects:
      - title: Exchange Load Injection Platform
        summary: >-
          Developed and supported a Go load-injection tool for an exchange
          platform, with distributed-system monitoring and performance tuning.
        highlights:
          - Sustained throughput up to 300K messages/sec.
          - Analyzed 500 GB of raw production trading PCAP data to build realistic load profiles.
          - Reduced message preparation latency from 146 us to 6 us through parallelization and optimization.
        technologies: Go, PCAP, distributed monitoring, performance engineering

      - title: Historical Trading Data Replay
        summary: >-
          Built tooling to replay real historical trading data and validate new
          releases against production-like market activity.
        highlights:
          - Replays a full trading day in 30 minutes to 2 hours, depending on volume.
          - Supports all instruments or targeted instrument subsets for focused validation.
        technologies: Go, trading data, release validation, load testing

      - title: Kubernetes Multi-Matching-Engine Test Automation
        summary: >-
          Automated configuration, reference-data generation, load generation,
          performance-metric calculation, and order execution/market-data reports.
        highlights:
          - Supports realistic deployments with up to four matching engines.
          - Reduced manually maintained test variants from 30 to 10.
        technologies: Kubernetes, Python, Go, performance analytics, test data generation

      - title: Post-Trade Platform Testing
        summary: >-
          Automates performance and resiliency validation for post-trade and
          clearing workflows across configurable load pipelines.
        highlights:
          - Measures p50, p99, average, and maximum latency using k6 and FIX test flows.
          - Runs fully automated long-duration tests for up to 12 hours.
          - Validates AWS infrastructure spanning EKS, Lambda, databases, and EC2.
        technologies: k6, FIX, AWS, EKS, Lambda, EC2, resiliency testing

  history:
    - role: Software Development Engineer in Test / DevOps
      time: Jun 2022 - Apr 2024
      company: Kaspersky
      highlights:
        - Built a Python/pytest automation framework and maintained hardware-in-the-loop test benches for automotive and embedded systems.
        - Created a development-board CLI that cut setup from 15-20 minutes to 2-3 minutes and parallel test execution from 2 hours to 15 minutes.
        - Integrated Vault-managed secrets and optimized CI images, caching, and parallelization to reduce build time by 30%.
      technologies: Python, Go, pytest, Azure DevOps, Vault, Docker, Grafana, InfluxDB, CAN, UDS, MQTT

    - role: Senior QA Automation Engineer
      time: Sep 2021 - Jun 2022
      company: Lenovo
      highlights:
        - Stabilized a Python/pytest API and integration framework, raising automated pass rate to about 95% and cutting execution time by 25-35%.
        - Migrated CI/CD from Bamboo to Jenkins and reverse-engineered a ZeroMQ protocol to expand internal-service coverage by about 30%.
      technologies: Python, pytest, REST API, ZeroMQ, Jenkins, Bamboo, JWT, JSON Schema

    - role: Quality Assurance Team Lead
      time: Aug 2020 - Sep 2021
      company: BPC Banking Technologies
      highlights:
        - Led QA process and delivery improvements, increasing team throughput by about 15-20% through workload and cycle-time analysis.
        - Automated isolated Kubernetes test environments and branch-level CI checks, reducing wasted QA effort on broken builds by 30-40%.
      technologies: Python, Go, Kubernetes, GitLab CI, Jenkins, Jira, Confluence, PLSQL

    - role: QA Specialist to QA Team Lead
      time: Feb 2014 - Aug 2020
      company: Exactpro
      highlights:
        - Progressed through three roles while testing low-latency exchange systems and automating FIX, ITCH, and native-protocol workflows.
        - Built load, analysis, environment, and monitoring tools; automated non-functional testing across four projects.
        - Led and mentored QA engineers while introducing InfluxDB/Grafana visibility and reducing manual environment support by 2-4x.
      technologies: Python, Go, Bash, JMeter, FIX, ITCH, Ansible, InfluxDB, Grafana, SQL

    - role: Earlier Infrastructure Experience
      time: Dec 2010 - Feb 2014
      company: Home Credit & Finance Bank; RIHMI-WDC
      highlights:
        - Supported banking middleware and research infrastructure across Linux/Unix, WebLogic/OSB, VMware, networks, databases, monitoring, and automation.
      technologies: RHEL, FreeBSD, WebLogic, Oracle Service Bus, VMware ESXi, Python, Jython, Zabbix

