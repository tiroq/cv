{% assign career = site.data.data.career_profile %}
<section class="resume-section profile-section" aria-labelledby="profile-title">
  <h2 id="profile-title">{{ career.title }}</h2>
  <p class="profile-copy">{{ career.summary }}</p>
  <ul class="impact-strip" aria-label="Selected impact">
    {% for highlight in career.highlights %}<li>{{ highlight }}</li>{% endfor %}
  </ul>
</section>
