{% assign projects = site.data.data.projects %}
<section class="resume-section selected-projects" aria-labelledby="projects-title">
  <h2 id="projects-title">{{ projects.title }}</h2>
  <div class="selected-project-grid">
    {% for project in projects.assignments %}
    <article class="selected-project">
      <h3>{{ project.title }} <span>{{ project.subtitle }}</span></h3>
      <p>{{ project.description }}</p>
      <p class="tech-line">{{ project.technologies }}</p>
    </article>
    {% endfor %}
  </div>
</section>
