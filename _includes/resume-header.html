{% assign profile = site.data.data.profile %}
<header class="resume-header">
  <div class="identity">
    <p class="eyebrow">Curriculum Vitae</p>
    <h1>{{ profile.name }}</h1>
    <p class="headline">{{ profile.headline }}</p>
  </div>
  <nav class="contact-list" aria-label="Contact information">
    <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
    <a href="https://www.linkedin.com/in/{{ profile.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/{{ profile.github }}" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>
