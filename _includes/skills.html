{% assign skills = site.data.data.skills %}
<section class="resume-section skills-section" aria-labelledby="skills-title">
  <h2 id="skills-title">{{ skills.title }}</h2>
  <div class="skills-grid">
    {% for group in skills.groups %}
    <div class="skill-group">
      <h3>{{ group.name }}</h3>
      <p>{{ group.items }}</p>
    </div>
    {% endfor %}
  </div>
</section>
