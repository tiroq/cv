{% assign profile = site.data.data.profile %}
{% assign machine = site.data.data.machine_profile %}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ machine.title | default: site.title }}</title>
  <meta name="description" content="{{ machine.summary | strip_newlines | escape }}">
  {% if machine.enabled and machine.include_in_html %}
  <meta name="keywords" content="{{ machine.keywords | concat: machine.technologies | join: ', ' | escape }}">
  <meta name="author" content="{{ profile.name }}">
  <meta name="candidate:roles" content="{{ machine.roles | join: ', ' | escape }}">
  <meta name="candidate:seniority" content="{{ machine.seniority | escape }}">
  <meta name="candidate:domains" content="{{ machine.domains | join: ', ' | escape }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ profile.name | jsonify }},
    "jobTitle": {{ machine.roles | jsonify }},
    "description": {{ machine.summary | jsonify }},
    "email": {{ profile.email | prepend: 'mailto:' | jsonify }},
    "sameAs": [
      {{ profile.linkedin | prepend: 'https://www.linkedin.com/in/' | jsonify }},
      {{ profile.github | prepend: 'https://github.com/' | jsonify }}
    ],
    "knowsAbout": {{ machine.keywords | concat: machine.technologies | jsonify }},
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Obninsk Institute for Nuclear Power Engineering"
    }
  }
  </script>
  {% endif %}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
</head>
